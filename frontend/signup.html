<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0a0a18"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sign up — Handle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<a class="btn ghost back" href="index.html">← Home</a>
<section class="center-view">
  <div class="card">
    <span class="logo"><span class="mark"></span>handle</span>
    <h2>Create your account</h2>
    <p class="sub">Claim the username everyone will find you by.</p>
    <button type="button" class="btn google block big" id="g-btn"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Continue with Google</button>
    <p class="hint">With Google you'll pick your username next.</p>
    <div class="divider">or</div>
    <form id="f-signup">
      <input id="su-name" placeholder="Unique username (e.g. sana_k)" pattern="[a-zA-Z0-9_]{3,20}" title="3-20 letters, numbers or underscores" autocomplete="off" required>
      <input id="su-email" type="email" placeholder="Email" autocomplete="email" required>
      <div class="pw"><input id="su-pass" type="password" placeholder="Password (6+ characters)" minlength="6" autocomplete="new-password" required><button type="button" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <p class="err" id="su-err"></p>
      <button class="btn big block" id="su-btn">Sign up</button>
    </form>
    <p class="alt">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</section>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
